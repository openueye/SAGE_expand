seed: 0

runtime:
  model_root: ../../SAGE-models
  require_clean_worktree: false
  prefetch_depth: 4

input:
  type: rosbag2
  rosbag: /home/DL/Projects/02_Thesis/03_Datasets/001_Odin/Ferrari1
  calibration: /home/DL/Projects/02_Thesis/03_Datasets/001_Odin/calibration.yaml
  topics:
    lidar: /odin1/cloud_slam
    image: /odin1/image/compressed
    odometry: /odin1/odometry
  lidar:
    # cloud_slam publishes each scan already registered into the odometry
    # reference frame; the pose chain must not be applied a second time.
    points_frame: reference_frame
    enable_fused: true
  synchronization:
    lidar_association: nearest_to_anchor
    max_lidar_skew_ms: 20.0
    max_pose_gap_ms: 100.0
  fusion:
    window: 5
    max_age_ms: 500.0
    conflict_threshold_m: 1.0
  depth:
    min_depth_m: 0.1
    max_depth_m: 200.0

spnet:
  model_id: spnet-large-300
  depth_scale_m: 200.0
  confidence: 0.4
  sample_stride: 8

mapping:
  map_every: 5
  keyframe_every: 5
  iterations: 90
  prune_every: 30
  prune_stop_after: 90
  learning_rates:
    means3d: 0.00016
    colors: 0.0025
    opacity_logits: 0.05
    log_scales: 0.001
    rotations: 0.001
  initial_opacity: 0.5
  scale_clamp_min: 1e-4
  initial_scale_anisotropy: [0.95, 1.05, 1.20]
  growth:
    coverage_alpha_threshold: 0.85
    min_candidate_depth_m: 0.1
    max_candidate_depth_m: 200.0
    candidate_duplicate_3d_threshold_m: 0.05
    confidence_thresholds:
      LIDAR_CENTER: 0.0
      LIDAR_FUSED: 0.5
      SPNET_COMPLETED: 0.25
    residual_thresholds:
      LIDAR_CENTER: {absolute_m: 0.15, relative: 0.03}
      LIDAR_FUSED: {absolute_m: 0.25, relative: 0.05}
      SPNET_COMPLETED: {absolute_m: 0.35, relative: 0.07}
  pruning:
    opacity_thresholds:
      LIDAR_CENTER: 0.05
      LIDAR_FUSED: 0.083
      SPNET_COMPLETED: 0.167
    spnet_min_prune_age: 30
    spnet_scale_ceiling_m: null
  loss:
    image_weight: 1.0
    ssim_weight: 0.2
    depth_weight: 0.268780155032039
    depth_coverage_weight: 0.05
    alpha_support: 0.85
    depth_coverage_threshold: 0.85
    epsilon: 0.000001

refinement:
  iterations: 4000
  color_learning_rate: 0.000625
  opacity_learning_rate: 0.0000625
  means3d_learning_rate: 0.000016
  log_scales_learning_rate: 0.0001
  rotations_learning_rate: 0.0001
  opacity_anchor_weight: 0.1
  lidar_depth_weight: 0.268780155032039
  dense_normal_weight: 0.05
  dense_normal_edge_weight_gamma: 10.0
  dense_normal_alpha_support: 0.85
  dense_normal_max_relative_depth_jump: 0.05
  dense_prior:
    grid_height: 2
    grid_width: 2
    min_lidar_support: 8
    confidence_exponent: 2.0
  exposure_learning_rate: 0.01
  exposure_log_gain_bound: 0.5
  exposure_bias_bound: 0.25
  exposure_anchor_weight: 10.0
  ssim_weight: 0.2
  milestones: [1000, 2000, 4000]

evaluation:
  min_alpha: 0.01
  epsilon: 0.000001
  alpha_support: 0.01
  hit_target_center: 0.5
  hit_target_fused: 0.35
