seed: 0

runtime:
  model_root: ../../SAGE-models
  require_clean_worktree: false

input:
  resize_width: 800
  resize_height: 648
  stream_queue_size: 1

spnet:
  model_id: spnet-large-300
  depth_scale_m: 200.0
  confidence: 0.4
  sample_stride: 8

mapping:
  map_every: 5
  keyframe_every: 5
  iterations: 90
  prune_every: 30
  prune_stop_after: 90
  learning_rates:
    means3d: 0.00016
    colors: 0.005
    opacity_logits: 0.05
    log_scales: 0.001
    rotations: 0.001
  initial_opacity: 0.5
  scale_clamp_min: 1e-4
  initial_scale_anisotropy: [0.95, 1.05, 1.20]
  growth:
    coverage_alpha_threshold: 0.85
    rgb_residual_threshold: 0.05
    min_candidate_depth_m: 0.1
    max_candidate_depth_m: 80.0
    candidate_duplicate_3d_threshold_m: 0.05
    confidence_thresholds:
      LIDAR_SLAM_CENTER: 0.0
      LIDAR_SLAM_FUSED5: 0.5
      SPNET_BLIND: 0.25
    residual_thresholds:
      LIDAR_SLAM_CENTER: {absolute_m: 0.15, relative: 0.03}
      LIDAR_SLAM_FUSED5: {absolute_m: 0.25, relative: 0.05}
      SPNET_BLIND: {absolute_m: 0.35, relative: 0.07}
  pruning:
    opacity_thresholds:
      LIDAR_SLAM_CENTER: 0.05
      LIDAR_SLAM_FUSED5: 0.08
      SPNET_BLIND: 0.15
    spnet_min_prune_age: 30
    spnet_scale_ceiling_m: null
  loss:
    image_weight: 1.0
    ssim_weight: 0.2
    depth_weight: 0.000000000001
    alpha_support: 0.85

refinement:
  iterations: 4000
  color_learning_rate: 0.000625
  opacity_learning_rate: 0.0000625
  means3d_learning_rate: 0.000016
  log_scales_learning_rate: 0.0001
  rotations_learning_rate: 0.0001
  opacity_anchor_weight: 0.1
  lidar_depth_weight: 0
  dense_normal_weight: 0.05
  dense_normal_edge_weight_gamma: 10.0
  dense_normal_alpha_support: 0.85
  dense_normal_max_relative_depth_jump: 0.05
  dense_prior:
    grid_height: 2
    grid_width: 2
    min_lidar_support: 8
    confidence_exponent: 2.0
    robust_epsilon_m: 0.01
  exposure_learning_rate: 0.01
  exposure_log_gain_bound: 0.5
  exposure_bias_bound: 0.25
  exposure_anchor_weight: 10.0
  ssim_weight: 0.2
  milestones: [1000, 2000, 4000]

evaluation:
  frame_selection: all
  min_alpha: 0.01
  epsilon: 0.000001
  alpha_support: 0.01
  hit_target_center: 0.5
  hit_target_fused: 0.35
