seed: 0

runtime:
  model_root: ../../SAGE-models
  require_clean_worktree: false

input:
  resize_width: 800
  resize_height: 648
  stream_queue_size: 1

spnet:
  model_id: spnet-large-300
  depth_scale_m: 200.0
  confidence: 0.4
  # Approximate LIC2's one candidate per 10x10 completion patch.
  sample_stride: 10

mapping:
  map_every: 5
  keyframe_every: 5
  # LIC2 optimizes up to 100 sampled training views per keyframe.
  iterations: 100
  prune_every: 30
  # LIC2's Gaussian-LIC growth path has no pruning stage.
  prune_stop_after: 0
  learning_rates:
    means3d: 0.00016
    colors: 0.0025
    opacity_logits: 0.05
    log_scales: 0.001
    rotations: 0.001
  initial_opacity: 0.1
  scale_clamp_min: 1e-4
  initial_scale_anisotropy: [1.0, 1.0, 1.0]
  growth:
    # LIC2 inserts a point whenever the projected pixel has alpha < 0.99.
    coverage_alpha_threshold: 0.99
    # Zero makes the RGB part of the SAGE coverage gate effectively permissive
    # for ordinary floating-point renders; exact zero residuals remain blocked.
    rgb_residual_threshold: 0.0
    min_candidate_depth_m: 0.0001
    max_candidate_depth_m: 20.0
    # Make SAGE's 3-D candidate deduplication negligible; it cannot be disabled
    # completely through config because the schema requires a positive value.
    candidate_duplicate_3d_threshold_m: 0.00000001
    confidence_thresholds:
      LIDAR_SLAM_CENTER: 0.0
      LIDAR_SLAM_FUSED5: 0.0
      SPNET_BLIND: 0.0
    residual_thresholds:
      # Disable SAGE's additional geometry-residual gate; LIC2 uses alpha only.
      LIDAR_SLAM_CENTER: {absolute_m: 1000000000.0, relative: 1000000000.0}
      LIDAR_SLAM_FUSED5: {absolute_m: 1000000000.0, relative: 1000000000.0}
      SPNET_BLIND: {absolute_m: 1000000000.0, relative: 1000000000.0}
  pruning:
    opacity_thresholds:
      LIDAR_SLAM_CENTER: 0.05
      LIDAR_SLAM_FUSED5: 0.08
      SPNET_BLIND: 0.15
    spnet_min_prune_age: 30
    spnet_scale_ceiling_m: null
  loss:
    image_weight: 1.0
    ssim_weight: 0.2
    # Match LIC2's default RGB/depth balance and remove SAGE-only coverage loss.
    depth_weight: 0.005
    depth_coverage_weight: 0.0
    # Approximate LIC2's binary rendered-depth validity mask.
    alpha_support: 0.000001
    depth_coverage_threshold: 0.85
    epsilon: 0.000001

refinement:
  iterations: 4000
  color_learning_rate: 0.000625
  opacity_learning_rate: 0.0000625
  means3d_learning_rate: 0.000016
  log_scales_learning_rate: 0.0001
  rotations_learning_rate: 0.0001
  opacity_anchor_weight: 0.1
  lidar_depth_weight: 0.005
  dense_normal_weight: 0.05
  dense_normal_edge_weight_gamma: 10.0
  dense_normal_alpha_support: 0.85
  dense_normal_max_relative_depth_jump: 0.05
  dense_prior:
    grid_height: 2
    grid_width: 2
    min_lidar_support: 8
    confidence_exponent: 2.0
    robust_epsilon_m: 0.01
  exposure_learning_rate: 0.01
  exposure_log_gain_bound: 0.5
  exposure_bias_bound: 0.25
  exposure_anchor_weight: 10.0
  ssim_weight: 0.2
  milestones: [1000, 2000, 4000]

evaluation:
  frame_selection: all
  min_alpha: 0.01
  epsilon: 0.000001
  alpha_support: 0.01
  hit_target_center: 0.5
  hit_target_fused: 0.35
