name: sage
platforms:
  - linux-64
channels:
  - pytorch
  - nvidia
  - conda-forge
pip-repositories:
  - https://download.pytorch.org/whl/cu121
dependencies:
  - python=3.10
  - cuda-nvcc=12.1
  - cuda-version=12.1
  - cuda-cudart=12.1
  - cuda-cudart_linux-64=12.1
  - cuda-cudart-dev=12.1
  - cuda-cccl=12.1
  - cuda-cccl_linux-64=12.1
  - gxx_linux-64=11.4.0
  - jinja2=3.1.6
  - numpy=2.2.6
  - pillow=12.2.0
  - pyyaml=6.0.3
  - pip
  - pip:
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - gsplat==1.5.3
      - torchmetrics==1.9.0
      - plyfile==1.1.4
      - opencv-python==5.0.0.93
      - -e .
